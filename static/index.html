<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Wardrobe & Outfit Stylist</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23E0AC4D' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='4' r='2'/><path d='M12 6v4l9 6a1 1 0 0 1-.6 1.8H3.6a1 1 0 0 1-.6-1.8L12 10'/></svg>">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        Babel.registerPreset('jsx-classic', {
            presets: [[Babel.availablePresets.react, { runtime: 'classic' }]]
        });
    </script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Wada Sanzo inspired palette
                        wada: {
                            mustard: '#E0AC4D',
                            carmine: '#A32938',
                            celadon: '#7B9B82',
                            ivory: '#F4ECE1',
                            navy: '#1A365D',
                            charcoal: '#333333'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #F8F6F0;
            color: #333333;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" data-presets="jsx-classic" src="app.js"></script>
</body>
</html>
